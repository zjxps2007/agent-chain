max_iterations: 3

steps:
  - role: coder
    agent: primary_coder
  - role: reviewer
    agent: style_reviewer
  - role: reviewer
    agent: len_reviewer
  - role: coder
    agent: fix_coder

agent_configs:
  primary_coder:
    style: google
    target_file: src/main.py
  style_reviewer:
    require_docstring: true
    max_line_length: 200
    target_file: src/main.py
  len_reviewer:
    require_docstring: false
    max_line_length: 50
    target_file: src/main.py
  fix_coder:
    style: compact
    target_file: src/main.py
