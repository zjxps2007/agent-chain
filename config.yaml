# AgentChain 파이프라인 설정 예시
max_iterations: 3

steps:
  - role: coder
    agent: primary_coder
  - role: reviewer
    agent: strict_reviewer

# 에이전트별 설정 (선택)
agent_configs:
  primary_coder:
    style: "google"
    include_types: true
  strict_reviewer:
    require_docstring: true
    max_line_length: 80
    rules:
      - no_todo
      - require_type_hints
